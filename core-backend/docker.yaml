version: '3.9'

services:
  # Baza produkcyjna
  finovara-db:
    image: postgres:15
    container_name: finovara-db
    restart: always
    environment:
      POSTGRES_DB: finovara_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    networks:
      - finovara-network

  # Baza testowa
  finovara-test:
    image: postgres:15
    container_name: finovara-test
    restart: always
    environment:
      POSTGRES_DB: finovara_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
    networks:
      - finovara-network

  # Aplikacja Spring Boot
  finovara-app:
    build: .
    container_name: finovara-app
    depends_on:
      finovara-db:
        condition: service_healthy
      finovara-test:
        condition: service_healthy
    ports:
      - "8443:8443"
    environment:
      # produkcja
      DB_PASSWORD: ${DB_PASSWORD}
      # testy
      DB_TEST_PASSWORD: ${DB_TEST_PASSWORD}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SSL_KEY_STORE_PASSWORD: ${SSL_KEY_STORE_PASSWORD}
      SPRING_PROFILES_ACTIVE: default
    volumes:
      - ./uploads:/app/uploads
    restart: always
    networks:
      - finovara-network

networks:
  finovara-network:
    external: true
    name: finovara-network