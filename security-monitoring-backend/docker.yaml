version: '3.9'

services:
  security-monitoring-db:
    image: postgres:17
    container_name: finovara-security-monitoring-db
    restart: always
    environment:
      POSTGRES_DB: finovara_security_monitoring
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      retries: 10
    networks:
      - finovara-network

  security-monitoring-app:
    build: .
    container_name: finovara-security-monitoring-app
    depends_on:
      security-monitoring-db:
        condition: service_healthy
    ports:
      - "8085:8085"
      - "9106:9106"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://finovara-security-monitoring-db:5432/finovara_security_monitoring
      SPRING_KAFKA_BOOTSTRAP_SERVERS: finovara-kafka:9092
      DEV_SSL_PASSWORD: ${DEV_SSL_PASSWORD}
    volumes:
      - ../localhost.p12:/app/localhost.p12
    healthcheck:
      test: ["CMD-SHELL", "curl -f https://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      retries: 10
    restart: always
    networks:
      - finovara-network

networks:
  finovara-network:
    external: true
    name: finovara-network