server:
  port: 8888
  ssl:
    enabled: true
    key-store: classpath:localhost.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-alias: 1

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - https://localhost:5173
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowed-headers:
                  - "*"
                allow-credentials: true
          default-filters:
            - PreserveHostHeader
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          x-forwarded:
            enabled: true
            for-enabled: true
            host-enabled: true
            proto-enabled: true
            port-enabled: true
            host-append: false
            proto-append: false
            port-append: false
          httpclient:
            ssl:
              use-insecure-trust-manager: true
          routes:
            - id: activity-log-backend
              uri: ${ACTIVITY_LOG_URL}
              predicates:
                - Path=/api/account-activity/**,/api/archive-activities/**

            - id: core-backend
              uri: ${CORE_BACKEND_URL}
              predicates:
                - Path=/**

logging:
  level:
    root: WARN
    com.finovara.api_gateway: INFO

management:
  endpoint:
    gateway:
      access: read_only
  endpoints:
    web:
      exposure:
        include: health,gateway
