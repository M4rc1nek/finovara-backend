server:
  port: 8888
  ssl:
    enabled: true
    key-store: file:/app/localhost.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_PASSWORD}
    key-alias: 1

application:
  name: api-gateway
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}

spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - https://localhost:5173
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                  - PATCH
                allowed-headers:
                  - "*"
                exposed-headers:
                  - Authorization
                allow-credentials: true
          default-filters:
            - PreserveHostHeader
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          x-forwarded:
            enabled: true
            for-enabled: true
            host-enabled: true
            proto-enabled: true
            port-enabled: true
            host-append: false
            proto-append: false
            port-append: false
          httpclient:
            ssl:
              use-insecure-trust-manager: true
          routes:
            - id: activity-log-backend
              uri: ${ACTIVITY_LOG_BACKEND_URL}
              predicates:
                - Path=/api/account-activity/**,/api/archive-activities/**

            - id: notification-backend
              uri: ${NOTIFICATION_BACKEND_URL}
              predicates:
                - Path=/api/notification-settings/**,/api/notifications/**

            - id: report-backend
              uri: ${REPORT_BACKEND_URL}
              predicates:
                - Path=/api/reports/**,/api/pdf/**

            - id: auth_backend
              uri: ${AUTH_BACKEND_URL}
              predicates:
                - Path=/api/auth/**,/api/profile-image/**,/profile-images/**,/api/password-reset/**,/api/contact,/oauth2/**,/login/oauth2/**,/api/account-settings/**,/api/email-change/**

            - id: finance_backend
              uri: ${FINANCE_BACKEND_URL}
              predicates:
                - Path=/**
logging:
  level:
    root: WARN
    com.finovara.api_gateway: INFO

security:
  whitelist:
    - /api/auth/**
    - /api/profile-image/**
    - /profile-images/**
    - /api/password-reset/**
    - /api/contact
    - /oauth2/**
    - /login/oauth2/**
    - /internal/**

management:
  endpoint:
    gateway:
      access: read_only
  endpoints:
    web:
      exposure:
        include: health,gateway
