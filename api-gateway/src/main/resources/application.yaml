server:
  port: 8888
  ssl:
    enabled: true
    key-store: classpath:localhost.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_KEY_STORE_PASSWORD}
    key-alias: 1

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      httpclient:
        ssl:
          use-insecure-trust-manager: true  # tylko do wewnętrznej sieci Docker
      routes:
        - id: monolit
          uri: ${MONOLIT_URL}
          predicates:
            - Path=/**

management:
  endpoints:
    web:
      exposure:
        include: health