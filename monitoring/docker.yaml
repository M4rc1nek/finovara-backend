version: '3.9'

services:
  finovara-prometheus:
    image: prom/prometheus:latest
    container_name: finovara-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - finovara-network

  finovara-grafana:
    image: grafana/grafana:latest
    container_name: finovara-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USERNAME}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.gmail.com:465
      GF_SMTP_USER: finovaracenter@gmail.com
      GF_SMTP_PASSWORD: ${MAIL_PASSWORD}
      GF_SMTP_FROM_ADDRESS: finovaracenter@gmail.com
      GF_SMTP_FROM_NAME: Finovara Monitoring
      GF_SMTP_SKIP_VERIFY: "true"
    depends_on:
      - finovara-prometheus
    restart: unless-stopped
    networks:
      - finovara-network

volumes:
  prometheus_data:
  grafana_data:

networks:
  finovara-network:
    external: true
    name: finovara-network