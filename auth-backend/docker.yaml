version: '3.9'

services:
  finovara-db:
    image: postgres:17
    container_name: finovara-db
    restart: always
    environment:
      POSTGRES_DB: finovara_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      retries: 10
    networks:
      - finovara-network

  finovara-test:
    image: postgres:17
    container_name: finovara-test
    restart: always
    environment:
      POSTGRES_DB: finovara_test
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      retries: 10
    networks:
      - finovara-network

  finovara-app:
    build: .
    container_name: finovara-app
    depends_on:
      finovara-db:
        condition: service_healthy
    ports:
      - "8443:8443"
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_TEST_PASSWORD: ${DB_TEST_PASSWORD}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: finovara-kafka:9092
      SPRING_PROFILES_ACTIVE: default
      SSL_PASSWORD: ${SSL_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
      - ../localhost.p12:/app/localhost.p12
    restart: always
    networks:
      - finovara-network

networks:
  finovara-network:
    external: true
    name: finovara-network