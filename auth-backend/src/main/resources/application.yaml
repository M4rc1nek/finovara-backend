spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://finovara-auth-db:5432/finovara_auth_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:changelog/changelog.xml
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
    cache:
      type: redis
  mail:
    host: smtp.gmail.com
    port: 465
    username: finovaracenter@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false
          ssl:
            enable: true
            trust: smtp.gmail.com
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "https://localhost:8443/login/oauth2/code/google"
            scope:
              - openid
              - email
              - profile
  kafka:
    bootstrap-servers: finovara-kafka:9092

server:
  port: 8443
  forward-headers-strategy: framework
  ssl:
    enabled: true
    key-store: file:/app/localhost.p12
    key-store-type: PKCS12
    key-store-password: ${SSL_PASSWORD}
    key-alias: 1

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000
  upload:
    profile-images-directory: uploads/profile-images
    profile-images-default-directory: uploads/profile-images/default

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.web.access: DEBUG
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG

mail:
  recipient:
    address: finovaracenter@gmail.com
  from:
    address: support@finovara.pl


verification-code-manager:
  code-expiration-minutes: 15
  attempts-expiration-minutes: 15
  max-attempts: 5

password-generator:
  length: 8

shared-account:
  search:
    page-size: 25


security:
  whitelist:
    - /api/auth/**
    - /api/profile-image/**
    - /profile-images/**
    - /api/password-reset/**
    - /api/contact
    - /oauth2/**
    - /login/oauth2/**
    - /internal/**
  cors:
    allowed-origins:
      - https://localhost:5173


management:
  server:
    port: 9101
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: auth-backend
    distribution:
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms